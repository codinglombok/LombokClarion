name: Greetings

on: [pull_request_target, issues]

permissions:
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to LombokClarion! Thank you for opening your first issue. Please fill in the bug/feature template so we can help faster."
        pr-message: "Thank you for your first pull request! A maintainer will review it shortly. Please make sure CI is green."
