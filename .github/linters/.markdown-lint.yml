---
# markdownlint configuration for LombokClarion (consumed by super-linter).
#
# NOTE: super-linter expects this exact filename (.markdown-lint.yml).
# Disables prose/style rules that are noisy on hand-written and generated
# docs (README badge tables, long URLs, CHANGELOG duplicate headings),
# while keeping structural and accessibility checks (heading increments,
# image alt text, table column consistency).
default: true

MD004: false   # Unordered list style
MD007: false   # Unordered list indentation
MD009: false   # Trailing spaces
MD010: false   # Hard tabs
MD012: false   # Multiple consecutive blank lines
MD013: false   # Line length (README badges + long URLs are intentional)
MD022: false   # Blank lines around headings (cosmetic)
MD024: false   # Duplicate headings (CHANGELOG repeats release headings)
MD025: false   # Multiple top-level headings
MD026: false   # Trailing punctuation in headings
MD029: false   # Ordered list item prefix
MD030: false   # Spaces after list markers
MD031: false   # Fenced code blocks surrounded by blank lines
MD032: false   # Lists surrounded by blank lines
MD033: false   # Inline HTML (README badges are intentional)
MD034: false   # Bare URLs
MD035: false   # Horizontal rule style
MD040: false   # Fenced code block language
MD041: false   # First line heading (issue/PR templates start with prose)
MD043: false   # Required heading structure
MD046: false   # Code block style
MD047: false   # File ends with a single newline
MD050: false   # Strong style
MD055: false   # Table pipe style
MD057: false   # Relative links (docs are mirrored to wiki)
MD058: false   # Blank lines around tables (cosmetic)
MD060: false   # Table column alignment (cosmetic)
